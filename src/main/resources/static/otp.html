<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Verify OTP - StudyVault</title>
    <link rel="stylesheet" href="css/otp.css">
</head>
<body>

<div class="wrapper">
    <div class="form-container">
        <div class="form-card">
            <h2>Verify OTP</h2>
            <p class="form-sub">Enter the 6-digit code sent to your email</p>

            <form id="otpForm">
                <div class="form-group">
                    <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required />
                </div>

                <button type="submit">Verify OTP</button>
                <div class="message" id="msg"></div>
            </form>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById("otpForm");
    const msgDiv = document.getElementById("msg");

    // Get email from localStorage
    const email = localStorage.getItem("user_email");

    if (!email) {
        msgDiv.style.color = "red";
        msgDiv.innerText = "Email not found in session. Please register again.";
        setTimeout(() => window.location.href = "register.html", 2000);
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const otp = document.getElementById("otp").value.trim();

        // Validate OTP
        if (!otp || otp.length !== 6 || isNaN(otp)) {
            msgDiv.style.color = "red";
            msgDiv.innerText = "Please enter a valid 6-digit OTP.";
            return;
        }

        try {
            const res = await fetch("http://localhost:8080/api/users/verify-otp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, otp })
            });

            if (res.ok) {
                msgDiv.style.color = "green";
                msgDiv.innerText = "OTP verified successfully!";
                localStorage.removeItem("user_email");
                setTimeout(() => {
                     if (res.ok) {
                          msgDiv.style.color = "green";
                          msgDiv.innerText = "OTP verified successfully!";
                          localStorage.removeItem("user_email");

                          setTimeout(() => {
                           window.location.href = "login.html";
                           }, 1500);
                     }
                    window.location.href = "login.html";
                }, 1500);
            } else {
                const errMsg = await res.text();
                msgDiv.style.color = "red";
                msgDiv.innerText = `Error: ${errMsg}`;
            }
        } catch (err) {
            msgDiv.style.color = "red";
            msgDiv.innerText = "Request failed: " + err.message;
        }
    });
</script>

</body>
</html>
