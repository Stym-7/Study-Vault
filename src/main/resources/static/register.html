<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Register - StudyVault</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="wrapper">
    <div class="form-container">
        <div class="form-card">
            <h2>Register to StudyVault</h2>
            <p class="form-sub">Create your account and access shared notes</p>

            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Name" required />
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required />
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required />
                </div>

                <button type="submit">Register</button>
                <div class="message" id="msg"></div>
            </form>

            <div class="helper">
                <span>Already have an account?</span>
                <a href="login.html" class="link-login">Login</a>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById("registerForm");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const data = { name, email, password };
        const msgDiv = document.getElementById("msg");

        try {
            const response = await fetch("http://localhost:8080/api/users/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                msgDiv.style.color = "green";
                msgDiv.classList.add('show');
                msgDiv.innerText = "Registration successful! Please check your email for OTP.";
                localStorage.setItem("user_email", email); // save for OTP verification
                setTimeout(() => window.location.href = "otp.html", 2000);
            } else {
                const errorText = await response.text();
                msgDiv.style.color = "red";
                msgDiv.classList.add('show');
                msgDiv.innerText = errorText;
            }
        } catch (err) {
            msgDiv.style.color = "red";
            msgDiv.classList.add('show');
            msgDiv.innerText = "Error: " + err.message;
        }
    });
</script>

</body>
</html>
